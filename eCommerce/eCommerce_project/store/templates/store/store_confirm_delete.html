{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h1>Delete Store</h1>
    <p>Are you sure you want to delete the store "<strong>{{ store.name }}</strong>"?</p>
    <p>This will also delete all products in this store.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: #cc0000;">Yes, Delete</button>
        <a href="{% url 'store:my_stores' %}">Cancel</a>
    </form>
{% endblock %}
