{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}



<div class="row justify-content-center">
    <div class="col-md-5">
        <h1>Login</h1>

        <form method="post" class="card-body shadow-sm" style="padding: 10%">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
        
            <a href="{% url 'password_reset' %}" class="btn btn-link">Forgot your password?</a>
        </form>
    </div>

</div>

<div class="row justify-content-center">

    <div class="col-md-5">
        <h2>Don't have an account?</h2>
        <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-lg w-100 mb-3">Register</a>
    </div>

</div>



{% endblock %}
