{% extends 'base.html' %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

<style>
    span.helptext,
    .helptext {

        display: block;
        color: rgb(133, 142, 204);
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: small;
        font-style: italic, oblique;
    }

    form p label,
    form label {
        font-weight: bold;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-3">Register New Account</h1>

        <form method="post" class="card-body shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn primary btn-lg w-100 mb-3" style="background-color: rgb(197, 255, 241);">Create Account</button>
            <a href="{% url 'login' %}" class="btn btn-link">Already have an account? Login</a>
        </form>

    </div>
</div>


{% endblock %}
